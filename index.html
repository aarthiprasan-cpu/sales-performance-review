<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Performance Monthly Review</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Calibri, Arial, sans-serif; background: #f5f5f5; color: #333; font-weight: 500; }
        .header { background: linear-gradient(135deg, #001a4d 0%, #0d7a7f 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 28px; font-weight: bold; }
        .container { max-width: 1400px; margin: 20px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .upload-section { padding: 25px; background: #f9f9f9; border-bottom: 2px solid #0d7a7f; }
        .upload-section h2 { color: #001a4d; margin-bottom: 15px; font-size: 16px; font-weight: bold; }
        .upload-area { border: 2px dashed #0d7a7f; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; background: #f0fafb; }
        .upload-area:hover { background: #e0f2f4; border-color: #001a4d; }
        #csvFile { display: none; }
        .file-input-label { display: inline-block; padding: 10px 20px; background: #0d7a7f; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .file-input-label:hover { background: #001a4d; }
        .filters-section { padding: 25px; background: white; border-bottom: 2px solid #eee; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: bold; color: #001a4d; margin-bottom: 5px; font-size: 13px; }
        select, input[type="text"], input[type="date"], input[type="month"], input[type="number"] { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-weight: 500; color: #333; }
        .action-buttons { padding: 15px 25px; background: #f9f9f9; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #0d7a7f; color: white; }
        .btn-primary:hover { background: #001a4d; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #229954; }
        .btn-info { background: #3498db; color: white; }
        .btn-info:hover { background: #2980b9; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }
        .tabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid #001a4d; background: #f5f5f5; }
        .tab-button { padding: 12px 20px; background: #e8e8e8; border: none; cursor: pointer; font-size: 13px; font-weight: bold; color: #333; border-bottom: 3px solid transparent; }
        .tab-button:hover { background: #d0d0d0; }
        .tab-button.active { background: white; color: #0d7a7f; border-bottom-color: #0d7a7f; font-weight: bold; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; font-weight: 500; }
        thead { background: #001a4d; color: white; position: sticky; top: 0; font-weight: bold; }
        th { padding: 10px; text-align: left; border: 1px solid #ddd; font-weight: bold; }
        td { padding: 10px; border: 1px solid #e0e0e0; color: #333; font-weight: 500; }
        tbody tr:nth-child(even) { background: #f9f9f9; }
        tbody tr:hover { background: #f0f0f0; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; }
        .status-l1 { background: #e8f4f8; color: #0d7a7f; }
        .status-l2 { background: #dde8f4; color: #001a4d; }
        .status-l3 { background: #fff3cd; color: #856404; }
        .status-l4 { background: #d1ecf1; color: #0c5460; }
        .status-l5 { background: #d4edda; color: #155724; }
        .status-won { background: #d4edda; color: #155724; }
        .status-lost { background: #f8d7da; color: #721c24; }
        .status-x { background: #e2e3e5; color: #383d41; }
        .message { padding: 15px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .message.info { background: #d1ecf1; color: #0c5460; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .no-data { text-align: center; padding: 40px; color: #999; background: #f9f9f9; font-weight: bold; }
        .summary-box { background: #f0fafb; padding: 15px; border-left: 4px solid #0d7a7f; margin-bottom: 15px; border-radius: 4px; color: #001a4d; font-weight: bold; }
        #contentContainer { padding: 25px; }
        .lead-modal { padding: 12px; border: 1px solid #e0e0e0; margin-bottom: 8px; cursor: pointer; border-radius: 4px; background: #f9f9f9; }
        .lead-modal:hover { background: #f0f0f0; border-color: #0d7a7f; }
        .lead-modal strong { color: #001a4d; font-weight: bold; }
        .grad-header { background: linear-gradient(135deg, #001a4d 0%, #0d7a7f 100%); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grad-header h2 { margin: 0 0 10px 0; font-size: 20px; font-weight: bold; }
        .grad-header p { margin: 0; font-size: 13px; opacity: 1; font-weight: 500; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Individual Performance Monthly Review</h1>
        <p>Odoo Sales Data Analysis & Reporting System</p>
    </div>

    <div class="container">
        <div class="upload-section">
            <h2>📁 Step 1: Upload Odoo Export</h2>
            <div class="upload-area" id="uploadArea">
                <input type="file" id="csvFile" accept=".csv" />
                <label for="csvFile" class="file-input-label">Choose CSV File</label>
                <p style="margin-top: 10px; color: #666; font-size: 13px; font-weight: 500;">or drag & drop your Odoo export CSV here</p>
            </div>
        </div>

        <div id="filtersSection" class="filters-section" style="display: none;">
            <h2>🔍 Step 2: Configure Report Filters</h2>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="salesperson">Salesperson</label>
                    <select id="salesperson"><option value="">-- All Salespersons --</option></select>
                </div>
                <div class="filter-group">
                    <label for="team">Sales Team</label>
                    <select id="team"><option value="">-- All Teams --</option></select>
                </div>
                <div class="filter-group">
                    <label for="period">Reporting Period (Month-Year)</label>
                    <input type="month" id="period" />
                </div>
                <div class="filter-group">
                    <label for="reportDate">Report Date</label>
                    <input type="date" id="reportDate" />
                </div>
                <div class="filter-group">
                    <label for="reviewName">Reviewer Name</label>
                    <input type="text" id="reviewName" placeholder="e.g., Monthly Sales Review" value="Monthly Sales Review" />
                </div>
            </div>
        </div>

        <div class="action-buttons" id="actionButtons" style="display: none;">
            <button class="btn btn-primary" onclick="generateReports()">📊 Generate All Reports</button>
            <button class="btn btn-success" onclick="exportToExcel()">📈 Export to Excel</button>
            <button class="btn btn-info" onclick="exportToPDF()">📄 Export to PDF</button>
            <button class="btn btn-secondary" onclick="resetApp()">↺ Reset</button>
        </div>

        <div id="tabsContainer" class="tabs" style="display: none;"></div>
        <div id="contentContainer" style="padding: 25px;"><div id="content"></div></div>
    </div>

    <script>
        let csvData = [];
        let processedData = {};
        let businessPlanLeads = [];
        let collectionData = {};
        let extraMonths = 0;

        const stageMappings = {
            'New - 0%-Visit/Call': 'L1',
            '10%-Enquiry': 'L1', '20%-Qualified': 'L2', '40%-Demo/Proof': 'L3',
            '41% Demo Requested': 'L3', '42% Discovery Call Done': 'L3', '43% Demo Planned': 'L3',
            '44% Demo Postponed': 'L3', '45% Demo Done': 'L3', '46% Further Demo Requested': 'L3',
            '47% All Demos Completed': 'L3', '60%-Proposal': 'L4', '80%-Order': 'L5',
            'Won - 100% Closure': 'Won', 'Lost': 'Lost',
            'To Be Deleted': 'X', 'Unassigned': 'X', 'Unreachable': 'X', 'Deferred': 'X', 'Dropped': 'X'
        };

        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });
        }

        function formatCurrency(value) {
            if (!value || isNaN(value)) return '₹0';
            return '₹' + parseFloat(value).toLocaleString('en-IN', { maximumFractionDigits: 0 });
        }

        function getMonthYear(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear().toString().slice(-2);
            return month + '-' + year;
        }

        function getMonthsArray() {
            const months = [];
            const monthNames = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const startMonth = 4, startYear = 2026;
            const currentDate = new Date();
            const currentMonth = currentDate.getMonth() + 1;
            const currentYear = currentDate.getFullYear();
            
            let month = startMonth;
            let year = startYear;
            
            while (year < currentYear || (year === currentYear && month <= currentMonth)) {
                months.push({ 
                    year: year % 100, 
                    month: month, 
                    display: monthNames[month] + '-' + (year % 100).toString().padStart(2, '0'), 
                    key: String(month).padStart(2, '0') + '-' + (year % 100).toString().padStart(2, '0')
                });
                month++;
                if (month > 12) {
                    month = 1;
                    year++;
                }
            }
            
            // Add extra months if needed
            for (let i = 0; i < extraMonths; i++) {
                if (month > 12) {
                    month = 1;
                    year++;
                }
                months.push({ 
                    year: year % 100, 
                    month: month, 
                    display: monthNames[month] + '-' + (year % 100).toString().padStart(2, '0'), 
                    key: String(month).padStart(2, '0') + '-' + (year % 100).toString().padStart(2, '0')
                });
                month++;
            }
            
            return months;
        }

        document.getElementById('csvFile').addEventListener('change', handleFileUpload);
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            document.getElementById('csvFile').files = e.dataTransfer.files;
            handleFileUpload({ target: { files: e.dataTransfer.files } });
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                Papa.parse(e.target.result, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        csvData = results.data.filter(row => Object.values(row).some(cell => cell !== ''));
                        initializeFilters();
                        document.getElementById('filtersSection').style.display = 'block';
                        document.getElementById('actionButtons').style.display = 'flex';
                        showMessage('✅ Loaded ' + csvData.length + ' leads from Odoo export', 'success');
                    }
                });
            };
            reader.readAsText(file);
        }

        function initializeFilters() {
            const salespersons = [...new Set(csvData.map(row => row['Salesperson']).filter(x => x))];
            const teams = [...new Set(csvData.map(row => row['Sales Team']).filter(x => x))];

            const spSelect = document.getElementById('salesperson');
            const teamSelect = document.getElementById('team');

            salespersons.forEach(sp => {
                const opt = document.createElement('option');
                opt.value = sp;
                opt.textContent = sp;
                spSelect.appendChild(opt);
            });

            teams.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                teamSelect.appendChild(opt);
            });

            document.getElementById('reportDate').valueAsDate = new Date();
            document.getElementById('period').valueAsDate = new Date();

            spSelect.addEventListener('change', onFilterChange);
            teamSelect.addEventListener('change', onFilterChange);
            document.getElementById('period').addEventListener('change', onFilterChange);
        }

        function onFilterChange() {
            if (csvData.length > 0 && document.getElementById('tabsContainer').style.display !== 'none') {
                generateReports();
            }
        }

        function generateReports() {
            if (csvData.length === 0) {
                showMessage('❌ Please upload a CSV file first', 'error');
                return;
            }

            const salesperson = document.getElementById('salesperson').value;
            const team = document.getElementById('team').value;
            const stageWise = {};
            const pipelineLeads = [];

            csvData.forEach(row => {
                const stage = row['Stage'] || '';
                const classification = stageMappings[stage] || 'Unknown';

                if (!stageWise[classification]) stageWise[classification] = [];

                let include = true;
                if (salesperson && row['Salesperson'] !== salesperson) include = false;
                if (team && row['Sales Team'] !== team) include = false;

                if (include) {
                    const leadData = {
                        leadNo: row['Lead Number'],
                        opportunity: row['Opportunity'],
                        companyName: row['Company Name'],
                        createdDate: row['Created on'],
                        city: row['City'],
                        state: row['State'],
                        stage: stage,
                        classification: classification,
                        team: row['Sales Team'],
                        salesperson: row['Salesperson'],
                        outlets: row['No of Outlets'],
                        currentSoftware: row['Current Software'],
                        competitor: row['Competitor Name'],
                        plannedDemo: row['Planned Demo Date'],
                        actualDemo: row['Actual Demo Date'],
                        demoGivenBy: row['Demo Given By'],
                        expectedClosing: row['Expected Closing'],
                        closedDate: row['Closed Date'],
                        expectedRevenue: parseFloat(row['Expected Revenue']) || 0,
                        expectedMRR: row['Expected MRR'],
                        products: row['Products'],
                        lostReason: row['Lost Reason'],
                        source: row['Source'],
                        industry: row['Industry Type']
                    };

                    stageWise[classification].push(leadData);

                    if (['L1', 'L2', 'L3', 'L4', 'L5'].includes(classification)) {
                        pipelineLeads.push(leadData);
                    }
                }
            });

            processedData = { stageWise, pipelineLeads };

            createTabs();
            switchTab(null, 'info');

            showMessage('✅ Reports generated successfully', 'success');
        }

        function createTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '<button class="tab-button active" onclick="switchTab(event, \'info\')">📋 Info & Summary</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'stage-wise\')">📊 Stage-Wise Count</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'l1-l2\')">📈 L1 & L2 Leads</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'l3\')">🎯 L3 Leads</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'l4-l5\')">🔔 L4 & L5 Leads</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'won\')">✅ Won Orders</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'lost\')">❌ Lost Orders</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'business-plan\')">📅 Business Plan</button>' +
                '<button class="tab-button" onclick="switchTab(event, \'collection-plan\')">💰 Collection Plan</button>';
            tabsContainer.style.display = 'flex';
        }

        function switchTab(event, tabName) {
            if (event && event.target) {
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }

            const contentContainer = document.getElementById('contentContainer');
            contentContainer.innerHTML = '';

            if (tabName === 'info') renderInfoTab();
            else if (tabName === 'stage-wise') renderStageWiseTab();
            else if (tabName === 'l1-l2') renderL1L2Tab();
            else if (tabName === 'l3') renderL3Tab();
            else if (tabName === 'l4-l5') renderL4L5Tab();
            else if (tabName === 'won') renderWonTab();
            else if (tabName === 'lost') renderLostTab();
            else if (tabName === 'business-plan') renderBusinessPlanTab();
            else if (tabName === 'collection-plan') renderCollectionPlanTab();
        }

        function renderInfoTab() {
            const salesperson = document.getElementById('salesperson').value || 'All Salespersons';
            const team = document.getElementById('team').value || 'All Teams';
            const period = document.getElementById('period').value || 'All Periods';
            const reportDate = formatDate(document.getElementById('reportDate').value);
            const reviewName = document.getElementById('reviewName').value;

            const stageWise = processedData.stageWise || {};

            // Report Configuration as elegant table
            let html = '<div style="margin-bottom: 30px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">' +
                '<div style="background: linear-gradient(135deg, #001a4d 0%, #0d7a7f 100%); color: white; padding: 15px;">' +
                '<h3 style="margin: 0; font-size: 16px; font-weight: bold;">📋 Report Configuration</h3>' +
                '</div>' +
                '<table style="width: 100%; border-collapse: collapse;">' +
                '<tbody>' +
                '<tr style="border-bottom: 1px solid #ddd;">' +
                '<td style="padding: 12px 15px; font-weight: bold; color: #001a4d; background: #f9f9f9; width: 30%;">Reviewer Name</td>' +
                '<td style="padding: 12px 15px; color: #000;">' + reviewName + '</td>' +
                '</tr>' +
                '<tr style="border-bottom: 1px solid #ddd;">' +
                '<td style="padding: 12px 15px; font-weight: bold; color: #001a4d; background: #f9f9f9;">Salesperson</td>' +
                '<td style="padding: 12px 15px; color: #000;">' + salesperson + '</td>' +
                '</tr>' +
                '<tr style="border-bottom: 1px solid #ddd;">' +
                '<td style="padding: 12px 15px; font-weight: bold; color: #001a4d; background: #f9f9f9;">Team</td>' +
                '<td style="padding: 12px 15px; color: #000;">' + team + '</td>' +
                '</tr>' +
                '<tr style="border-bottom: 1px solid #ddd;">' +
                '<td style="padding: 12px 15px; font-weight: bold; color: #001a4d; background: #f9f9f9;">Period</td>' +
                '<td style="padding: 12px 15px; color: #000;">' + period + '</td>' +
                '</tr>' +
                '<tr>' +
                '<td style="padding: 12px 15px; font-weight: bold; color: #001a4d; background: #f9f9f9;">Report Date</td>' +
                '<td style="padding: 12px 15px; color: #000;">' + reportDate + '</td>' +
                '</tr>' +
                '</tbody>' +
                '</table>' +
                '</div>';

            // Stage-wise counts
            ['L1', 'L2', 'L3', 'L4', 'L5', 'Won', 'Lost'].forEach(stage => {
                const count = (stageWise[stage] || []).length;
                const revenue = (stageWise[stage] || []).reduce((sum, lead) => sum + (lead.expectedRevenue || 0), 0);
                html += '<div style="display: inline-block; margin: 10px; padding: 15px; background: #f9f9f9; border-left: 4px solid #0d7a7f; border-radius: 4px; min-width: 150px;">' +
                    '<strong style="color: #001a4d;">' + stage + '</strong><br>' +
                    '<span style="font-size: 20px; font-weight: bold; color: #001a4d;">' + count + '</span> leads<br>' +
                    '<small style="color: #666; font-weight: bold;">' + formatCurrency(revenue) + '</small>' +
                    '</div>';
            });

            // Leads by Salesperson & Stage
            html += '<div style="margin-top: 30px; padding: 15px; background: #f0fafb; border-left: 4px solid #001a4d; border-radius: 4px; margin-bottom: 20px;">' +
                '<h3 style="color: #001a4d; margin-bottom: 15px; font-weight: bold;">👥 Leads by Salesperson & Stage</h3>';

            // Group leads by salesperson
            const leadsBySalesperson = {};
            Object.values(stageWise).flat().forEach(lead => {
                if (!leadsBySalesperson[lead.salesperson]) {
                    leadsBySalesperson[lead.salesperson] = {};
                }
                if (!leadsBySalesperson[lead.salesperson][lead.classification]) {
                    leadsBySalesperson[lead.salesperson][lead.classification] = [];
                }
                leadsBySalesperson[lead.salesperson][lead.classification].push(lead);
            });

            Object.keys(leadsBySalesperson).sort().forEach(sp => {
                const spLeads = leadsBySalesperson[sp];
                html += '<div style="margin-bottom: 15px; padding: 12px; background: white; border-radius: 4px; border: 1px solid #ddd;">' +
                    '<strong style="color: #001a4d; font-size: 14px;">👤 ' + sp + '</strong><br>';

                Object.keys(spLeads).sort().forEach(stage => {
                    const count = spLeads[stage].length;
                    const stageRevenue = spLeads[stage].reduce((sum, l) => sum + (l.expectedRevenue || 0), 0);
                    // Count cold calls for this salesperson & stage
                    const coldCallCount = spLeads[stage].filter(l => l.source && l.source.toLowerCase().includes('cold')).length;
                    
                    html += '<div style="margin-left: 15px; padding: 8px; background: #f9f9f9; border-radius: 3px; margin-top: 8px;">' +
                        '<span class="status-badge status-' + stage.toLowerCase() + '" style="margin-right: 10px;">' + stage + '</span>' +
                        '<strong style="color: #333; font-weight: bold;">' + count + ' leads</strong> | ' +
                        '<span style="color: #0d7a7f; font-weight: bold;">' + formatCurrency(stageRevenue) + '</span>' +
                        (coldCallCount > 0 ? ' | <span style="color: #dc3545; font-weight: bold;">🔴 ' + coldCallCount + ' Cold Calls</span>' : '') +
                        '</div>';
                });

                html += '</div>';
            });

            html += '</div>';

            // Show Inactive leads
            const xLeads = stageWise['X'] || [];
            const xByStage = {};
            xLeads.forEach(lead => {
                const stg = lead.stage || 'Unknown';
                if (!xByStage[stg]) xByStage[stg] = [];
                xByStage[stg].push(lead);
            });

            if (Object.keys(xByStage).length > 0) {
                html += '<div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border: 2px solid #001a4d; border-radius: 8px;">' +
                    '<strong style="color: #001a4d; font-size: 14px;">📊 Inactive/Discarded Leads</strong><br><br>';

                Object.keys(xByStage).sort().forEach(stg => {
                    const count = xByStage[stg].length;
                    html += '<div style="display: inline-block; margin: 8px; padding: 12px; background: white; border-left: 4px solid #999; border-radius: 4px; min-width: 140px;">' +
                        '<strong style="color: #555;">' + stg + '</strong><br>' +
                        '<span style="font-size: 16px; font-weight: bold; color: #333;">' + count + '</span> leads' +
                        '</div>';
                });

                html += '<div style="margin-top: 10px; text-align: right; font-size: 12px; color: #666; font-weight: bold;">Total Inactive: ' + xLeads.length + '</div></div>';
            }

        function addLeadToMonth(leadNo, monthKey) {
            const stageWise = processedData.stageWise || {};
            const allLeads = [...(stageWise['L1'] || []),
                ...(stageWise['L2'] || []),
                ...(stageWise['L3'] || []),
                ...(stageWise['L4'] || []),
                ...(stageWise['L5'] || [])];

            const lead = allLeads.find(l => l.leadNo === leadNo);
            if (lead && !businessPlanLeads.some(l => l.leadNo === leadNo && l.month === monthKey)) {
                businessPlanLeads.push({...lead, month: monthKey, remarks: ''});
                renderBusinessPlanTab();
                closeAddLeadToMonthModal();
                showMessage('✅ Lead ' + leadNo + ' - ' + lead.opportunity + ' added to ' + monthKey, 'success');
            }
        }

        function removeLeadFromMonth(leadNo, monthKey) {
            businessPlanLeads = businessPlanLeads.filter(l => !(l.leadNo === leadNo && l.month === monthKey));
            renderBusinessPlanTab();
            showMessage('✅ Lead removed from ' + monthKey, 'success');
        }

        function updateLeadRemarks(leadNo, monthKey, remarks) {
            const lead = businessPlanLeads.find(l => l.leadNo === leadNo && l.month === monthKey);
            if (lead) {
                lead.remarks = remarks;
            }
        }

        function updateLeadValue(leadNo, monthKey, value) {
            const lead = businessPlanLeads.find(l => l.leadNo === leadNo && l.month === monthKey);
            if (lead) {
                lead.actualValue = parseFloat(value) || 0;
            }
        }

            showMessage('✅ Next month added - Now showing ' + months.length + ' months total', 'success');
            renderBusinessPlanTab();

        function exportBusinessPlanExcel() {
            try {
                showMessage('📊 Exporting Business Plan (month-wise)...', 'info');
                const months = getMonthsArray();
                const wb = XLSX.utils.book_new();
                
                months.forEach(m => {
                    const monthLeads = businessPlanLeads.filter(l => l.month === m.key) || [];
                    if (monthLeads.length === 0) return;
                    
                    // Create data with proper structure
                    const data = [];
                    data.push(['BUSINESS PLAN — ' + m.display, '', '', '', '', '']);
                    data.push(['']);
                    data.push(['Customer Name', 'Vertical', 'No. of Outlets', 'Order Value (Rs. Lakhs)', 'Actual Value (₹)', 'Remarks']);
                    
                    monthLeads.forEach(lead => {
                        const orderValueLakhs = (lead.expectedRevenue / 100000).toFixed(2);
                        data.push([
                            lead.opportunity,
                            lead.industry || 'N/A',
                            lead.outlets || 0,
                            parseFloat(orderValueLakhs),
                            lead.actualValue || 0,
                            lead.remarks || ''
                        ]);
                    });
                    
                    const ws = XLSX.utils.aoa_to_sheet(data);
                    
                    // Apply formatting
                    ws['A1'].fill = { patternType: 'solid', fgColor: { rgb: 'FF001a4d' } };
                    ws['A1'].font = { bold: true, color: { rgb: 'FFFFFFFF' }, size: 14 };
                    
                    // Header row
                    for (let col = 0; col < 6; col++) {
                        const cellRef = String.fromCharCode(65 + col) + '3';
                        if (ws[cellRef]) {
                            ws[cellRef].fill = { patternType: 'solid', fgColor: { rgb: 'FF001a4d' } };
                            ws[cellRef].font = { bold: true, color: { rgb: 'FFFFFFFF' } };
                        }
                    }
                    
                    ws['!cols'] = [{ wch: 25 }, { wch: 15 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 20 }];
                    
                    XLSX.utils.book_append_sheet(wb, ws, m.display);
                });
                
                XLSX.writeFile(wb, 'Business_Plan_' + new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '.xlsx');
                showMessage('✅ Business Plan Excel exported (month-wise sheets)!', 'success');
            } catch (e) {
                showMessage('❌ Failed: ' + e.message, 'error');
            }
        }

                        backgroundColor: '#ffffff',
                        allowTaint: true,
                        useCORS: true,
                        logging: false
                    });
                    
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({

                        unit: 'mm',

                    tempDiv.style.left = '-9999px';
                    tempDiv.style.width = '1280px';
                    document.body.appendChild(tempDiv);
                    
                    const canvas = await html2canvas(tempDiv, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        allowTaint: true,
                        useCORS: true,
                        logging: false
                    });
                    
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = 'BusinessPlan_' + m.display.replace('-', '_') + '.png';

                    document.body.removeChild(link);
                    document.body.removeChild(tempDiv);
                }
                
                showMessage('✅ Presentation images created (add to PowerPoint)!', 'success');
            } catch (e) {
                showMessage('❌ Export failed: ' + e.message, 'error');
            }
        }

        function renderCollectionPlanTab() {
            const months = getMonthsArray();

            let html = '<div class="grad-header">' +
                '<h2>💰 Collection Plan — Monthly Cash Flow Tracking</h2>' +
                '<p>Sales Order | New Collection | Old Collection (₹ Lakhs)</p>' +
                '</div>' +
                '<div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">' +
                '<button class="btn btn-primary" onclick="addNextMonthsCollection()">➕ Add Next Month</button>' +
                '<button class="btn btn-info" onclick="importCollectionExcel()">📥 Import Excel</button>' +
                '<button class="btn btn-success" onclick="exportCollectionExcel()">📊 Export Excel</button>' +
                '<button class="btn btn-info" onclick="exportCollectionPDF()">📄 Export PDF</button>' +
                '<button class="btn btn-secondary" onclick="exportCollectionImage()">🖼️ Export Image</button>' +
                '</div>' +
                '<div class="table-wrapper"><table>' +
                '<thead><tr><th>Month</th>' +
                '<th colspan="3" style="text-align: center; background: #001a4d; color: white; font-weight: bold;">Sales Order</th>' +
                '<th colspan="3" style="text-align: center; background: #001a4d; color: white; font-weight: bold;">New Collection</th>' +
                '<th colspan="3" style="text-align: center; background: #001a4d; color: white; font-weight: bold;">Old Collection</th></tr>' +
                '<tr><th></th>' +
                '<th style="background: #e8f4f8; font-weight: bold; color: #000;">Plan</th>' +
                '<th style="background: #e8f4f8; font-weight: bold; color: #000;">Actual</th>' +
                '<th style="background: #e8f4f8; font-weight: bold; color: #000;">Achievement %</th>' +
                '<th style="background: #fff3cd; font-weight: bold; color: #000;">Plan</th>' +
                '<th style="background: #fff3cd; font-weight: bold; color: #000;">Actual</th>' +
                '<th style="background: #fff3cd; font-weight: bold; color: #000;">Achievement %</th>' +
                '<th style="background: #d4edda; font-weight: bold; color: #000;">Plan</th>' +
                '<th style="background: #d4edda; font-weight: bold; color: #000;">Actual</th>' +
                '<th style="background: #d4edda; font-weight: bold; color: #000;">Achievement %</th></tr></thead><tbody>';

            months.forEach(m => {
                const data = collectionData[m.key] || {};
                html += '<tr>' +
                    '<td><strong style="color: #001a4d; font-weight: bold;">' + m.display + '</strong></td>' +
                    '<td style="background: #f9f9f9;"><input type="number" id="so_plan_' + m.key + '" style="width: 100%; padding: 6px; font-weight: bold; color: #000;" placeholder="0" value="' + (data.soPlan || '') + '" onchange="updateCollectionData(\'' + m.key + '\')" /></td>' +
                    '<td style="background: #f9f9f9;"><input type="number" id="so_actual_' + m.key + '" style="width: 100%; padding: 6px; font-weight: bold; color: #000;" placeholder="0" value="' + (data.soActual || '') + '" onchange="updateCollectionData(\'' + m.key + '\')" /></td>' +
                    '<td style="background: #f0f0f0; text-align: center; font-weight: bold; color: #000;" id="so_ach_' + m.key + '">-</td>' +
                    '<td style="background: #f9f9f9;"><input type="number" id="nc_plan_' + m.key + '" style="width: 100%; padding: 6px; font-weight: bold; color: #000;" placeholder="0" value="' + (data.ncPlan || '') + '" onchange="updateCollectionData(\'' + m.key + '\')" /></td>' +
                    '<td style="background: #f9f9f9;"><input type="number" id="nc_actual_' + m.key + '" style="width: 100%; padding: 6px; font-weight: bold; color: #000;" placeholder="0" value="' + (data.ncActual || '') + '" onchange="updateCollectionData(\'' + m.key + '\')" /></td>' +
                    '<td style="background: #f0f0f0; text-align: center; font-weight: bold; color: #000;" id="nc_ach_' + m.key + '">-</td>' +
                    '<td style="background: #f9f9f9;"><input type="number" id="oc_plan_' + m.key + '" style="width: 100%; padding: 6px; font-weight: bold; color: #000;" placeholder="0" value="' + (data.ocPlan || '') + '" onchange="updateCollectionData(\'' + m.key + '\')" /></td>' +
                    '<td style="background: #f9f9f9;"><input type="number" id="oc_actual_' + m.key + '" style="width: 100%; padding: 6px; font-weight: bold; color: #000;" placeholder="0" value="' + (data.ocActual || '') + '" onchange="updateCollectionData(\'' + m.key + '\')" /></td>' +
                    '<td style="background: #f0f0f0; text-align: center; font-weight: bold; color: #000;" id="oc_ach_' + m.key + '">-</td></tr>';
            });

            html += '</tbody></table></div>' +
                '<div style="margin-top: 20px; padding: 15px; background: linear-gradient(135deg, #f0fafb 0%, #e8f4f8 100%); border-left: 4px solid #001a4d; border-radius: 4px; font-size: 12px;">' +
                '<strong style="color: #001a4d; font-weight: bold;">📌 Collection Plan Guide:</strong><br>' +
                '• <strong>Sales Order (₹ Lakhs):</strong> Paper order value (Won Orders)<br>' +
                '• <strong>New Collection (₹ Lakhs):</strong> Payments received against new orders (including advance)<br>' +
                '• <strong>Old Collection (₹ Lakhs):</strong> Outstanding payment collections from previous periods<br>' +
                '• <strong>Achievement %:</strong> Auto-calculated as (Actual / Plan) × 100' +
                '</div>';

            document.getElementById('contentContainer').innerHTML = html;
        }

        function updateCollectionData(monthKey) {
            if (!collectionData[monthKey]) collectionData[monthKey] = {};

            const soPlan = parseFloat(document.getElementById('so_plan_' + monthKey).value) || 0;
            const soActual = parseFloat(document.getElementById('so_actual_' + monthKey).value) || 0;
            const ncPlan = parseFloat(document.getElementById('nc_plan_' + monthKey).value) || 0;
            const ncActual = parseFloat(document.getElementById('nc_actual_' + monthKey).value) || 0;
            const ocPlan = parseFloat(document.getElementById('oc_plan_' + monthKey).value) || 0;
            const ocActual = parseFloat(document.getElementById('oc_actual_' + monthKey).value) || 0;

            collectionData[monthKey] = { soPlan, soActual, ncPlan, ncActual, ocPlan, ocActual };

            const soAch = soPlan > 0 ? ((soActual / soPlan) * 100).toFixed(1) : '-';
            const ncAch = ncPlan > 0 ? ((ncActual / ncPlan) * 100).toFixed(1) : '-';
            const ocAch = ocPlan > 0 ? ((ocActual / ocPlan) * 100).toFixed(1) : '-';

            document.getElementById('so_ach_' + monthKey).textContent = soAch === '-' ? '-' : soAch + '%';
            document.getElementById('nc_ach_' + monthKey).textContent = ncAch === '-' ? '-' : ncAch + '%';
            document.getElementById('oc_ach_' + monthKey).textContent = ocAch === '-' ? '-' : ocAch + '%';
        }

        function addNextMonthsCollection() {
            extraMonths = Math.min(extraMonths + 1, 12);
            showMessage('✅ Next month added', 'success');
            renderCollectionPlanTab();
        }

        function importCollectionExcel() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.csv';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file.name.endsWith('.csv')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        Papa.parse(event.target.result, {
                            header: true,
                            complete: (results) => {
                                showMessage('✅ Collection data imported from ' + file.name, 'success');
                            }
                        });
                    };
                    reader.readAsText(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const wb = XLSX.read(event.target.result, { type: 'array' });
                        showMessage('✅ Collection data imported from ' + file.name, 'success');
                    };
                    reader.readAsArrayBuffer(file);
                }
            };
            input.click();
        }

        function exportCollectionExcel() {
            const ws = XLSX.utils.aoa_to_sheet([['Collection Plan Report']]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Collection Plan");
            XLSX.writeFile(wb, "Collection_Plan.xlsx");
            showMessage('✅ Collection Plan exported to Excel', 'success');
        }

        function exportCollectionPDF() {
            showMessage('📄 Exporting Collection Plan to PDF...', 'success');
        }

        function exportCollectionImage() {
            showMessage('🖼️ Exporting Collection Plan as Image...', 'success');
        }

        function showMessage(message, type) {
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            msg.textContent = message;

            const container = document.getElementById('contentContainer');
            container.insertBefore(msg, container.firstChild);

            setTimeout(() => msg.remove(), 4000);
        }

        function exportToExcel() {
            exportBusinessPlanExcel();
        }

        function exportToPDF() {
            exportBusinessPlanPDF();
        }

        function resetApp() {
            if (!confirm('Are you sure you want to reset? All data will be cleared.')) return;
            csvData = [];
            processedData = {};
            businessPlanLeads = [];
            collectionData = {};
            extraMonths = 0;
            document.getElementById('csvFile').value = '';
            document.getElementById('filtersSection').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('contentContainer').innerHTML = '';
            showMessage('✅ Application reset', 'success');
        }
    </script>
</body>
